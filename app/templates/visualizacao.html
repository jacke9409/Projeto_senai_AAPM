<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Premium – AAPM</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --red-dark:   #1a0505;
      --red-mid:    #7a1010;
      --white:      #f5f0ee;
      --gold:       #c8a84b;
      --gold-light: #e8c96a;
      --topbar-bg:  rgba(20, 20, 19, 0.85);
      --sidebar-bg: rgba(15, 12, 12, 0.75);
    }
 
    html, body {
      height: 100%;
      font-family: 'Barlow', sans-serif;
      color: var(--white);
      overflow: hidden;
      perspective: 1000px; /* Base para o efeito 3D da GSAP */
    }
 
    /* ── BACKGROUND ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('/static/assets/fundo-abstrato.jpg');
      background-size: cover; 
      background-position: center;
      background-color: var(--red-mid);
    }
    .bg::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(192,32,42,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 80% 20%, rgba(122,16,16,0.3) 0%, transparent 65%),
        linear-gradient(135deg, rgba(26,5,5,0.4) 0%, rgba(122,16,16,0.2) 100%);
    }
 
    /* ── TOPBAR HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 85px;
      background-color: var(--topbar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid rgba(200, 168, 75, 0.2);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transform: translateY(-100%); /* Começa escondido para a GSAP animar */
    }
    .welcome-box h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px; font-weight: 400;
      color: var(--gold-light); 
      letter-spacing: 2px;
    }
    .welcome-box p {
      font-size: 13px; font-weight: 400;
      color: rgba(255,255,255,0.7);
      margin-top: -2px;
    }
    .logo-container {
      position: absolute; left: 50%; transform: translateX(-50%);
    }
    .logo-placeholder {
      width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid var(--gold);
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 16px; color: var(--gold);
      box-shadow: 0 0 15px rgba(200, 168, 75, 0.3);
    }
 
    /* ── MAIN CONTENT WRAPPER ── */
    .dashboard-container {
      position: relative; z-index: 10;
      height: 100vh;
      padding-top: 85px;
      display: flex;
    }
 
    /* ── SIDEBAR MENU ── */
    nav.sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      margin: 30px 0 30px 30px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column;
      padding: 30px 15px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      transform: translateX(-150%); /* Começa escondido para a GSAP animar */
    }
    .sidebar .menu-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 2px;
      color: var(--gold); 
      margin-bottom: 25px; 
      padding-left: 12px;
    }
    .sidebar ul {
      list-style: none; display: flex; flex-direction: column; gap: 8px;
    }
    .sidebar ul li {
      opacity: 0; /* Controlado pelo stagger da GSAP */
      transform: translateX(-20px);
    }
    .sidebar ul li a {
      color: rgba(255,255,255,0.8); text-decoration: none;
      font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }
    .sidebar ul li a:hover {
      color: #1a0505;
      background: var(--gold);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(200, 168, 75, 0.3);
    }
    .sidebar .logout-link {
      margin-top: auto; 
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      color: rgba(255,255,255,0.5); text-decoration: none;
      font-size: 14px; font-weight: 600;
      border-radius: 12px;
      transition: all 0.2s;
      opacity: 0;
    }
    .sidebar .logout-link:hover { 
      color: #fff; 
      background: rgba(211, 47, 47, 0.4); 
    }
 
    /* ── BANNER CENTRAL AREA ── */
    main.main-content {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
    }
    
    .promo-card {
      display: flex;
      width: 100%; max-width: 680px; height: 340px;
      background-color: #0d0605;
      border-radius: 28px;
      border: 1px solid rgba(200, 168, 75, 0.25);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      opacity: 0;
      transform: scale(0.9); /* Início da animação GSAP */
      transform-style: preserve-3d;
      will-change: transform;
    }
    
    .promo-img-side {
      width: 45%;
      background-image: url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .promo-img-side::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 50%, #0d0605 100%);
    }
    
    .promo-text-side {
      width: 55%;
      padding: 40px;
      display: flex; flex-direction: column; justify-content: center;
      transform: translateZ(30px); /* Dá profundidade real aos textos no efeito 3D */
    }
    .promo-text-side h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-weight: 400; font-size: 42px;
      line-height: 1.0; letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 16px;
    }
    .promo-text-side .author {
      font-size: 20px; font-weight: 700;
      color: var(--gold-light); margin-bottom: 4px;
    }
    .promo-text-side .social-tag {
      font-size: 13px; color: rgba(255,255,255,0.5);
      font-weight: 400;
    }
 
    /* ── BOTTOM INDICATOR BAR ── */
    .bottom-indicator {
      position: fixed; bottom: 25px; right: 30px;
      background: rgba(20, 20, 19, 0.8);
      border: 1px solid rgba(200,168,75,0.2);
      backdrop-filter: blur(8px);
      padding: 8px 20px; border-radius: 50px;
      font-size: 12px; font-weight: 600; color: var(--gold-light);
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 100;
      transform: translateY(100px);
    }

    /* Responsividade */
    @media (max-width: 900px) {
      .dashboard-container { flex-direction: column; padding-top: 85px; overflow-y: auto; }
      nav.sidebar { width: auto; margin: 20px; height: auto; }
      nav.sidebar ul { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .promo-card { flex-direction: column; height: auto; max-width: 450px; margin-bottom: 50px; }
      .promo-img-side { width: 100%; height: 200px; }
      .promo-img-side::after { background: linear-gradient(to bottom, transparent 50%, #0d0605 100%); }
      .promo-text-side { width: 100%; text-align: center; padding: 30px; }
    }
  </style>
</head>
<body>
 
  <div class="bg"></div>
 
  <header id="topbar">
    <div class="welcome-box">
      <h1>BEM VINDO</h1>
      <p>Conheça nossos serviços e catálogos</p>
    </div>
    
    <div class="logo-container">
      <div class="logo-placeholder">AAPM</div>
    </div>
    
    <div style="width: 100px;"></div>
  </header>
 
  <div class="dashboard-container">
    
    <nav class="sidebar" id="sidebar">
      <div class="menu-title">Navegação</div>
      <ul>
        <li class="menu-item"><a href="#catalogos">📊 <span>Catálogos</span></a></li>
        <li class="menu-item"><a href="#categorias">🏷️ <span>Categorias</span></a></li>
        <li class="menu-item"><a href="#horarios">🕒 <span>Horários</span></a></li>
        <li class="menu-item"><a href="#servicos">🛠️ <span>Serviços disponíveis</span></a></li>
        <li class="menu-item"><a href="#duvidas">💡 <span>Dúvidas</span></a></li>
      </ul>
      <a href="/" class="logout-link" id="logout">🚪 <span>Sair</span></a>
    </nav>
 
    <main class="main-content">
      <div class="promo-card" id="promoCard">
        <div class="promo-img-side"></div>
        <div class="promo-text-side">
          <h2>Inovação<br>Tecnológica</h2>
          <p class="author">Senai-SP</p>
          <p class="social-tag">Instagram: @senaitextilemoda</p>
        </div>
      </div>
    </main>
    
  </div>
 
  <div class="bottom-indicator" id="badge">
    <span>🛡️ Painel Administrativo Ativo</span>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      // 1. Linha do tempo para a animação de entrada (Intro)
      const tl = gsap.timeline({ defaults: { ease: "power4.out" } });

      tl.to("#topbar", { translateY: 0, duration: 1 })
        .to("#sidebar", { translateX: 0, duration: 1 }, "-=0.7")
        .to(".menu-item", { opacity: 1, translateX: 0, duration: 0.5, stagger: 0.15 }, "-=0.6")
        .to("#logout", { opacity: 1, duration: 0.4 }, "-=0.2")
        .to("#promoCard", { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.2)" }, "-=0.6")
        .to("#badge", { translateY: 0, duration: 0.5 }, "-=0.4");


      // 2. Efeito Magnético 3D Inteligente (Mouse Move Parallax)
      const card = document.getElementById("promoCard");
      
      // Roda apenas em telas maiores (Desktops) para evitar quebras no mobile
      if (window.innerWidth > 900) {
        document.addEventListener("mousemove", (e) => {
          const xAxis = (window.innerWidth / 2 - e.pageX) / 35; // Intensidade do giro horizontal
          const yAxis = (window.innerHeight / 2 - e.pageY) / 35; // Intensidade do giro vertical
          
          gsap.to(card, {
            rotationY: xAxis,
            rotationX: -yAxis,
            duration: 0.5,
            ease: "power2.out"
          });
        });

        // Reseta a posição do card perfeitamente quando o mouse sai da tela
        document.addEventListener("mouseleave", () => {
          gsap.to(card, {
            rotationY: 0,
            rotationX: 0,
            duration: 0.8,
            ease: "power3.out"
          });
        });
      }
    });
  </script>
</body>
</html>
