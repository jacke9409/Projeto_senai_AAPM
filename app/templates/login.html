{% extends "base.html" %}

{% block title %}Login - AAPM{% endblock %}

{% block content %}
<div style="max-width:400px; margin:80px auto; background:rgba(0,0,0,0.7); padding:2rem; border-radius:12px; text-align:center;">
  <h2 style="color:#C47B45;">Acesso Administrativo</h2>
  <form method="post" action="/api/login">
    <input type="email" name="email" placeholder="E-mail" required style="width:100%; padding:10px; margin:10px 0; border-radius:6px; border:none;">
    <input type="password" name="senha" placeholder="Senha" required style="width:100%; padding:10px; margin:10px 0; border-radius:6px; border:none;">
    <button type="submit" class="btn btn--primary" style="width:100%;">Entrar</button>
  </form>
</div>
{% endblock %}
