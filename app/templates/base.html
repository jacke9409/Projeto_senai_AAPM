<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AAPM – SENAI Brás-SP{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --burgundy:   #6B1E2E;
      --copper:     #A0522D;
      --copper-lt:  #C47B45;
      --charcoal:   #1A1A1A;
      --smoke:      #2C2C2C;
      --silver:     #9BA0A8;
      --cream:      #F0EAE0;
      --glass-bg:   rgba(20, 15, 15, 0.55);
      --glass-border: rgba(160, 82, 45, 0.35);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--charcoal);
      font-family: 'Josefin Sans', sans-serif;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .hero__bg {
      position: absolute; inset: 0;
      background-image: url('/static/assets/fundo-abstrato.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .hero__overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        120deg,
        rgba(10, 4, 4, 0.55) 0%,
        rgba(20, 8, 8, 0.35) 50%,
        rgba(10, 4, 4, 0.45) 100%
      );
      z-index: 1;
    }

    .hero__grain {
      position: absolute; inset: 0; z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      pointer-events: none;
    }

    .topbar {
      position: relative; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid rgba(160, 82, 45, 0.18);
      background: rgba(10, 5, 5, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .hero__content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: center;
      flex: 1;
      padding: 0 56px 40px;
    }

    .logo {
      position: absolute; top: 70px; left: 40px;
      z-index: 20;
      width: 130px; height: 130px;
    }
    .logo img {
      width: 100%; height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 24px rgba(160,82,45,0.5));
    }

    /* Estilos adicionais para páginas que precisam sobrescrever */
    .no-logo .logo { display: none; }
    .full-height .hero__content { padding: 0; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
<section class="hero">
  <div class="hero__bg"></div>
  <div class="hero__overlay"></div>
  <div class="hero__grain"></div>
  
  <div class="logo">
    <img src="/static/assets/Logo AAPM.svg" alt="Logo AAPM" />
  </div>
  
  <div class="hero__content">
    {% block content %}{% endblock %}
  </div>
</section>
{% block extra_js %}{% endblock %}
</body>
</html>
