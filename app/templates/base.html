<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAPM - SENAI Brás</title>
    
    <style>
        /* Reset básico e importação de fonte moderna */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            /* SEU CAMINHO DE IMAGEM ADICIONADO AQUI */
            background: url('/static/assets/fundo-abstrato.jpg') no-repeat center center;
            background-size: cover;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* Cabeçalho (Logos e Identificação) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .unidade-info {
            text-align: right;
            max-width: 400px;
        }

        .unidade-info h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.1;
            color: #1a1a1a; /* Tom escuro combinando com o topo da arte */
            text-shadow: 1px 1px 2px rgba(255,255,255,0.3);
        }

        .unidade-info p {
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Conteúdo Principal (Texto Centralizado) */
        .hero-text {
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
        }

        .hero-text .tag {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .hero-text .brand {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .hero-text .brand-tag {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 30px;
            opacity: 0.8;
            text-transform: uppercase;
        }

        /* Container de Botões (Ações) */
        .hero-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* Estilo para o botão "Entrar" (Dourado/Gold) */
        .btn-gold {
            background-color: #d4af37;
            color: #1a1a1a;
        }

        .btn-gold:hover {
            background-color: #fff;
            color: #d4af37;
            transform: translateY(-3px);
        }

        /* Estilo para o botão "Ver Catálogo" (Contorno/Outline) */
        .btn-outline {
            background-color: transparent;
            color: #fff;
            border: 2px solid #fff;
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            .unidade-info {
                text-align: center;
            }
            .hero-text h1 {
                font-size: 1.7rem;
            }
            body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="/static/assets/Logo AAPM.svg" alt="Logo AAPM" onerror="this.style.display='none'; this.parentElement.innerText='[Logo AAPM]'">
        </div>
        
        <div class="unidade-info">
            <h1>SENAI<br>BRÁS-SP</h1>
            <p>Francisco Matarazzo - Rua Correia de Andrade, 232<br>Têxtil e Moda</p>
        </div>
    </header>

    <main class="hero-text">
        <p class="tag">SENAI</p>
        <h1>Acesse o site da AAPM e<br>descubra sobre nossos<br>produtos com praticidade e<br>rapidez.</h1>
        <div class="brand">Compre e agende com a AAPM</div>
        <div class="brand-tag">AAPM</div>
        
        <div class="hero-actions">
            <a href="/login" class="btn btn-gold">Entrar</a>
            <a href="/visualizacao" class="btn btn-outline">Ver Catálogo</a>
        </div>
    </main>

</body>
</html>
