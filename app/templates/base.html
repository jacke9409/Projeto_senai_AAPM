    .shell {
      position: relative; z-index: 10;
      display: flex; height: 100vh;
    }

      width: var(--sidebar-w);
      background: var(--sidebar-bg);

    }

    nav a {
      display: block;
      padding: 11px 16px;
      font-size: 13px; font-weight: 600;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      letter-spacing: 0.5px;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }
    nav a:hover, nav a.active {
      color: var(--white);
      background: rgba(200,168,75,0.08);
      border-left-color: var(--gold);
    }

    .sidebar-spacer { flex: 1; }

      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);

      background-position: center;
      background-color: var(--red-mid); /* fallback enquanto sem imagem */
    }

    .bg::before {
      content: '';
      position: absolute; inset: 0;

        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(192,32,42,0.85) 0%, transparent 70%),

    /* ícones decorativos ao fundo */
    .bg-icons {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-icons span {
      position: absolute;
      font-size: clamp(24px, 3vw, 48px);

    header {

    .logo-placeholder {
      width: 64px; height: 64px; border-radius: 50%;

      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; color: var(--gold); letter-spacing: 1px;
    }
 
    .senai-info {
      text-align: right;
    }

      margin-bottom: 12px;
    }
    .hero-text .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(20px, 2.8vw, 34px);
      letter-spacing: 4px;
      color: var(--white);
    }

      font-size: 10px; letter-spacing: 3px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      margin-top: 4px;
    }
 
    .hero-actions {
      margin-top: 40px;
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .btn {
      padding: 12px 32px;
      border-radius: 4px;
      font-family: 'Barlow', sans-serif;
      font-size: 15px; font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer; text-decoration: none;
      transition: all 0.25s;
      display: inline-block;
    }
    .btn-gold {
      background: var(--gold);
      color: var(--text-dark);

    .btn-outline {
      background: transparent;
      color: var(--white);
      border: 2px solid rgba(255,255,255,0.5);
    }
    .btn-outline:hover { border-color: var(--white); transform: translateY(-2px); }
 
    /* ── FOOTER ── */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      text-align: center; padding: 12px;
      font-size: 10px; letter-spacing: 2px;
      color: rgba(255,255,255,0.45); text-transform: uppercase;
    }
 
    /* fade-in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-text > * { animation: fadeUp 0.8s ease both; }
    .hero-text .tag        { animation-delay: 0.1s; }
    .hero-text h1          { animation-delay: 0.25s; }
    .hero-text .brand      { animation-delay: 0.4s; }
    .hero-text .brand-tag  { animation-delay: 0.5s; }
    .hero-actions          { animation: fadeUp 0.8s 0.6s ease both; }
  </style>
</head>
